name: integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    name: Suite integrity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # FC3's `claude plugin validate` step is skipped with a warning here (no
      # claude CLI on the runner); run it locally before a release.
      - name: check-suite-integrity
        run: bash scripts/check-suite-integrity.sh

  install-roundtrip:
    name: install -> verify -> uninstall -> verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Round trip into a temp CLAUDE_HOME
        run: bash scripts/test-install-roundtrip.sh
